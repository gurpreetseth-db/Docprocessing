# =============================================================================
# App runtime manifest (minimal on purpose).
# =============================================================================
# The command is defined here; all environment variables and resource wiring are
# supplied by the bundle app resource (resources/app.yml -> config.env), which is
# the single source of truth and substitutes values from config.yml. This keeps
# catalog/schema names, the Genie agent name, the warehouse id and job id out of
# source control drift.
#
# The app reads these env vars (set by the bundle): JOB_ID, DATABRICKS_WAREHOUSE_ID,
# CATALOG, BRONZE_SCHEMA, SILVER_SCHEMA, GOLD_SCHEMA, VOLUME_NAME, GENIE_SPACE_NAME.
# =============================================================================
command:
  - "python"
  - "app.py"

env:
  - name: DATABRICKS_APP_PORT
    value: "8050"
    description: "Port for the Dash app (default 8050)"
