bundle:
  name: doc-processing-bundle

variables:
  catalog:
    default: DocProcessing
  bronze_schema:
    default: DocProcess_Bronze
  silver_schema:
    default: DocProcess_Silver
  gold_schema:
    default: DocProcess_Gold
  volume_name:
    default: InputPDFs
  genie_space_name:
    default: "Doc Processing Helper"
  genie_space_id:
    description: "Genie space id (populate after creating the 'Doc Processing Helper' space)"
    default: ""
  warehouse_id:
    description: "SQL Warehouse id the app uses to query submissions/runs"
    default: "29b33b8b6a20b116"
  app_name:
    default: doc-processing-app
  app_principal:
    description: "Service principal id the Databricks App runs as (granted read on the catalog by the setup job)"
    default: "0fc21fa6-04c2-42fe-b620-b267744a682a"

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: "https://dbc-8aa630af-e02d.cloud.databricks.com/"

