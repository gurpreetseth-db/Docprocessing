# =============================================================================
# Doc Processing — Databricks Asset Bundle root
# =============================================================================
# All configurable names/ids live in config.yml (the single source of truth,
# included below as bundle `variables`). This file only declares the bundle,
# what to include, and the deployment targets.
# =============================================================================
bundle:
  name: doc-processing-bundle

include:
  - config.yml          # variables: (catalog, schemas, genie name, app name, ...)
  - resources/*.yml     # pipeline, jobs, app, dashboard

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: "https://dbc-8aa630af-e02d.cloud.databricks.com/"
    # To retarget a different workspace/naming, override variables here, e.g.:
    #   variables:
    #     catalog: DocProcessing_Prod
    #     warehouse_id: "<other-warehouse-id>"
