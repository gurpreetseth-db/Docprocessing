# =============================================================================
# Jobs
# =============================================================================
#  * doc_processing_job   -> runs the Lakeflow pipeline (Bronze->Silver->Gold),
#                            then provisions/refreshes the Genie Agent. Scheduled
#                            every 4h AND triggered on-demand from the app's
#                            "Pipeline Ops" tab (this job's id is passed to the
#                            app as JOB_ID).
#  * doc_processing_setup -> one-off: creates catalog/schemas/volume/users, grants
#                            the app's service principal, and generates the sample
#                            Service Plan PDFs. Run once after first deploy.
#
# All names/counts/schedule come from config.yml via ${var.*}.
# =============================================================================
resources:
  jobs:
    doc_processing_job:
      name: "[${bundle.target}] Doc Processing - Scheduled Pipeline"
      tags:
        project: doc-processing
      schedule:
        quartz_cron_expression: ${var.processing_cron}
        timezone_id: ${var.timezone}
        pause_status: UNPAUSED
      tasks:
        - task_key: run_document_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.doc_processing_pipeline.id}
        # Physically move rejected PDFs out of the landing volume into the FailedFiles
        # volume (the pipeline can only detect + quarantine; it cannot move files).
        # Runs after the pipeline; independent of the metric-views / Genie branch.
        - task_key: move_failed_files
          depends_on:
            - task_key: run_document_pipeline
          notebook_task:
            notebook_path: ../src/ops/move_failed_files.py
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              volume_name: ${var.volume_name}
              failed_volume_name: ${var.failed_volume_name}
        # Governed metric views sit on top of the Gold facts, so they run after the
        # pipeline has materialized them.
        - task_key: create_metric_views
          depends_on:
            - task_key: run_document_pipeline
          notebook_task:
            notebook_path: ../src/gold/create_metric_views.py
            base_parameters:
              catalog: ${var.catalog}
              gold_schema: ${var.gold_schema}
        # Genie references Gold tables + metric views, so it runs last.
        - task_key: provision_genie
          depends_on:
            - task_key: create_metric_views
          notebook_task:
            notebook_path: ../src/setup/provision_genie.py
            base_parameters:
              catalog: ${var.catalog}
              gold_schema: ${var.gold_schema}
              genie_space_name: ${var.genie_space_name}
              warehouse_id: ${var.warehouse_id}
              app_name: ${var.app_name}
      queue:
        enabled: true

    doc_processing_setup:
      name: "[${bundle.target}] Doc Processing - Setup & Sample Data"
      tags:
        project: doc-processing
      tasks:
        - task_key: generate_sample_data
          notebook_task:
            notebook_path: ../src/setup/generate_sample_data.py
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              volume_name: ${var.volume_name}
              failed_volume_name: ${var.failed_volume_name}
              num_users: ${var.num_users}
              num_documents: ${var.num_documents}
              generate_anomalies: ${var.generate_anomalies}
              anomaly_document_count: ${var.anomaly_document_count}
              app_name: ${var.app_name}
          # Serverless notebook compute (no cluster block needed)
      queue:
        enabled: true
