# =============================================================================
# Databricks App — Service Plan Document Intelligence (Dash, 3 tabs)
# =============================================================================
# App source lives in ../src/app (app.py + app.yaml + requirements.txt).
#
# RUNTIME env + command live in ../src/app/app.yaml (that file is authoritative
# for a Databricks App — a bundle `config.env` here is NOT merged into the
# running container when the source app.yaml defines env). So this file only:
#   * names the app + points at the source, and
#   * declares the APP RESOURCES the app needs.
#
# The resources below do two things:
#   1. Grant the app's service principal permission on each resource
#      (CAN_MANAGE_RUN on the job so it can trigger runs; CAN_USE on the SQL
#       warehouse for queries / job-run listing).
#   2. Back the `valueFrom: "<name>"` lookups in app.yaml — the platform
#      resolves `app-job` -> the job id (JOB_ID) and `app-warehouse` -> the
#      warehouse id (DATABRICKS_WAREHOUSE_ID) at runtime.
#
# The Genie space is resolved BY NAME (GENIE_SPACE_NAME) at runtime, so no
# Genie space-id is ever wired.
# =============================================================================
resources:
  apps:
    doc_processing_app:
      name: ${var.app_name}
      description: "Service Plan Document Intelligence — submit, process & query care plans"
      source_code_path: ../src/app
      resources:
        - name: app-job
          job:
            id: ${resources.jobs.doc_processing_job.id}
            permission: CAN_MANAGE_RUN
        - name: app-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
