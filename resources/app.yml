# =============================================================================
# Databricks App — Service Plan Document Intelligence (Dash, 3 tabs)
# =============================================================================
# The app's source lives in ../src/app (app.py + app.yaml + requirements.txt).
#
# Resource wiring:
#   * job -> bundle reference (always valid at deploy). Exposed to the app as
#     JOB_ID so the "Pipeline Ops" tab can trigger runs.
#
# The following are NOT wired as bundle app-resources because their ids are not
# known at deploy time (no SQL warehouse chosen yet; the Genie space is created
# after deploy). Set them as app environment variables in src/app/app.yaml
# (or in the App UI -> Environment) once known:
#     DATABRICKS_WAREHOUSE_ID, GENIE_SPACE_ID, PIPELINE_ID
# The app reads these from env and degrades gracefully when they are empty.
# =============================================================================
resources:
  apps:
    doc_processing_app:
      name: ${var.app_name}
      description: "Service Plan Document Intelligence — submit, process & query care plans"
      source_code_path: ../src/app
      resources:
        - name: app-job
          job:
            id: ${resources.jobs.doc_processing_job.id}
            permission: CAN_MANAGE_RUN
